[package]
name = "cmux-tui"
version = "0.0.2"
edition = "2024"
description = "CMUX (3GPP TS 27.010) 串口调试 TUI，最多同时收发两个子通道"
license = "MIT"
repository = "https://github.com/hocking-lee/cmux-tui"
readme = "README.md"
keywords = ["cmux", "serial", "27010", "tui", "modem"]
categories = ["command-line-utilities", "embedded"]

[dependencies]
ratatui = "0.30"
serialport = { version = "4.9", default-features = false }
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
thiserror = "2"
anyhow = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
